<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - AutoServe</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="logo">🔧 AutoServe</div>
    <p class="subtitle">Sign in to your account</p>

    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required/>
      </div>
      <div class="form-group">
        <label>Login As</label>
        <select id="role" class="form-control">
          <option value="CUSTOMER">Customer</option>
          <option value="ADMIN">Admin</option>
          <option value="PROVIDER">Service Provider</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.textContent = 'Signing in...';
    btn.disabled = true;
    try {
      const data = await api.postPublic('/auth/login', {
        email:    document.getElementById('email').value,
        password: document.getElementById('password').value,
        role:     document.getElementById('role').value
      });
      saveAuth(data);
      const role = data.user.role;
      if (role === 'ADMIN')    window.location.href = 'admin/dashboard.html';
      else if (role === 'PROVIDER') window.location.href = 'provider/dashboard.html';
      else window.location.href = 'customer/dashboard.html';
    } catch (err) {
      showToast(err.message, 'error');
      btn.textContent = 'Sign In';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
