<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assigned Jobs - AutoServe</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

<nav class="navbar">
  <div class="logo">🔧 AutoServe <span style="font-size:0.75rem;background:#dbeafe;color:#1e40af;padding:0.2rem 0.5rem;border-radius:4px;margin-left:0.5rem;">PROVIDER</span></div>
  <div class="nav-links">
    <span id="userName" style="font-weight:600;"></span>
    <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-label">Provider Panel</div>
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="assigned-jobs.html" class="active">🔧 Assigned Jobs</a>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1>Assigned Jobs</h1>
      <p>All jobs assigned to you. Update status as you progress.</p>
    </div>

    <div class="card mb-2" style="padding:1rem;">
      <div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end;">
        <div class="form-group" style="margin:0;flex:1;min-width:150px;">
          <label>Filter by Status</label>
          <select id="filterStatus" class="form-control" onchange="loadJobs()">
            <option value="">All</option>
            <option value="CONFIRMED">Confirmed</option>
            <option value="IN_PROGRESS">In Progress</option>
            <option value="QUALITY_CHECK">Quality Check</option>
            <option value="COMPLETED">Completed</option>
          </select>
        </div>
        <div class="form-group" style="margin:0;flex:1;min-width:150px;">
          <label>Date</label>
          <input type="date" id="filterDate" class="form-control" onchange="loadJobs()"/>
        </div>
      </div>
    </div>

    <div id="jobsList">
      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr><th>ID</th><th>Customer</th><th>Service</th><th>Vehicle</th><th>Date & Slot</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody id="jobsTable">
              <tr><td colspan="7" class="text-center text-muted" style="padding:2rem;">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Update Status Modal -->
<div class="modal-overlay" id="updateModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Update Job #<span id="modalJobId"></span></span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div style="background:var(--bg);border-radius:var(--radius);padding:1rem;margin-bottom:1rem;">
      <p><strong>Customer:</strong> <span id="modalCustomer"></span></p>
      <p><strong>Service:</strong> <span id="modalService"></span></p>
      <p><strong>Vehicle:</strong> <span id="modalVehicle"></span></p>
    </div>

    <div class="form-group">
      <label>Update Status</label>
      <select id="statusSelect" class="form-control">
        <option value="CONFIRMED">Confirmed</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="QUALITY_CHECK">Quality Check</option>
        <option value="COMPLETED">Completed</option>
      </select>
    </div>
    <div class="form-group">
      <label>Work Notes</label>
      <textarea id="workNotes" class="form-control" rows="3" placeholder="Describe work done, parts replaced, etc..."></textarea>
    </div>
    <div class="form-group" id="amountGroup">
      <label>Final Amount ($)</label>
      <input type="number" id="finalAmount" class="form-control" placeholder="0.00" step="0.01" min="0"/>
    </div>
    <div style="display:flex;gap:1rem;justify-content:flex-end;">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveUpdate()">Update Job</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  const user = requireAuth('PROVIDER');
  if (user) {
    document.getElementById('userName').textContent = user.firstName + ' ' + user.lastName;
    loadJobs();
  }

  // Auto-open if job ID in URL
  const params = new URLSearchParams(window.location.search);
  if (params.get('id')) openUpdate(params.get('id'));

  let currentJobId = null;

  async function loadJobs() {
    const status = document.getElementById('filterStatus').value;
    const date   = document.getElementById('filterDate').value;
    let url = '/provider/jobs?';
    if (status) url += 'status=' + status + '&';
    if (date)   url += 'date=' + date;
    try {
      const jobs = await api.get(url);
      const tbody = document.getElementById('jobsTable');
      if (!jobs.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted" style="padding:2rem;">No jobs found.</td></tr>';
        return;
      }
      tbody.innerHTML = jobs.map(j => `
        <tr>
          <td>#${j.id}</td>
          <td>${j.customerName}</td>
          <td>${j.serviceType.replace(/_/g,' ')}</td>
          <td>${j.vehicleMake} ${j.vehicleModel}<br><small class="text-muted">${j.vehicleNumber}</small></td>
          <td>${new Date(j.scheduledDate).toLocaleDateString()}<br><small class="text-muted">${j.slotTime || ''}</small></td>
          <td><span class="badge badge-${j.status.toLowerCase().replace(/_/g,'-')}">${j.status.replace(/_/g,' ')}</span></td>
          <td><button class="btn btn-primary btn-sm" onclick="openUpdate(${j.id}, '${j.status}', '${j.customerName}', '${j.serviceType}', '${j.vehicleMake} ${j.vehicleModel} (${j.vehicleNumber})')">Update</button></td>
        </tr>
      `).join('');
    } catch { showToast('Failed to load jobs', 'error'); }
  }

  function openUpdate(id, status, customer, service, vehicle) {
    currentJobId = id;
    document.getElementById('modalJobId').textContent   = id;
    document.getElementById('modalCustomer').textContent = customer || '';
    document.getElementById('modalService').textContent  = (service || '').replace(/_/g,' ');
    document.getElementById('modalVehicle').textContent  = vehicle || '';
    document.getElementById('statusSelect').value = status || 'IN_PROGRESS';
    document.getElementById('workNotes').value = '';
    document.getElementById('finalAmount').value = '';
    document.getElementById('updateModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('updateModal').classList.remove('open');
    currentJobId = null;
  }

  async function saveUpdate() {
    const status = document.getElementById('statusSelect').value;
    try {
      await api.put('/provider/jobs/' + currentJobId, {
        status,
        notes:       document.getElementById('workNotes').value,
        finalAmount: parseFloat(document.getElementById('finalAmount').value) || null
      });
      showToast('Job updated!', 'success');
      closeModal();
      loadJobs();
    } catch (err) { showToast(err.message, 'error'); }
  }
</script>
</body>
</html>
