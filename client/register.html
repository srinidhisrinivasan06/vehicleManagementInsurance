<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - AutoServe</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="logo"> AutoServe</div>
    <p class="subtitle">Create your account</p>

    <form id="registerForm">
      <div class="grid-2">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="firstName" class="form-control" placeholder="John" required/>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="lastName" class="form-control" placeholder="Doe" required/>
        </div>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required/>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" class="form-control" placeholder="+1 234 567 8900" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="Min 8 characters" required/>
      </div>
      <div class="form-group">
        <label>Register As</label>
        <select id="role" class="form-control">
          <option value="CUSTOMER">Customer</option>
          <option value="PROVIDER">Service Provider</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.textContent = 'Creating account...';
    btn.disabled = true;
    try {
      await api.postPublic('/auth/register', {
        firstName: document.getElementById('firstName').value,
        lastName:  document.getElementById('lastName').value,
        email:     document.getElementById('email').value,
        phone:     document.getElementById('phone').value,
        password:  document.getElementById('password').value,
        role:      document.getElementById('role').value
      });
      showToast('Account created! Please login.', 'success');
      setTimeout(() => window.location.href = 'login.html', 1500);
    } catch (err) {
      showToast(err.message, 'error');
      btn.textContent = 'Create Account';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
